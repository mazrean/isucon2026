# __REGION__ / __FWD__ / __FWD_SECRET__ are filled in by scripts/deploy.sh per host.
# On europe1/america1 (__FWD__=1) non-GET /api/ requests are forwarded to asia1's
# app over the private network (via the router), where the DB is 1ms away.
upstream app_local {
  server 127.0.0.1:8080;
  keepalive 128;
  keepalive_requests 100000;
}
upstream app_remote {
  server __FWD_TARGET__:8080;
  keepalive 256;
  keepalive_timeout 300s;
  keepalive_requests 100000;
}
map $request_method $isu_fwd_method {
  GET __FWD_GET__;
  HEAD __FWD_GET__;
  default __FWD__;
}
map $isu_fwd_method $isu_backend {
  1 app_remote;
  default app_local;
}
map $isu_fwd_method $isu_fwd_region {
  1 __REGION__;
  default "";
}
map $isu_fwd_method $isu_fwd_secret {
  1 __FWD_SECRET__;
  default "";
}

server {
  listen 80 default_server backlog=4096 reuseport;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  location /api/notifications {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Fwd-Region "";
    proxy_set_header X-Isureal-Fwd-Secret "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_pass http://app_local;
  }

  location /internal/ {
    return 404;
  }

  location /api/images/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Fwd-Region "";
    proxy_set_header X-Isureal-Fwd-Secret "";
    proxy_pass http://app_local;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Fwd-Region $isu_fwd_region;
    proxy_set_header X-Isureal-Fwd-Secret $isu_fwd_secret;
    proxy_pass http://$isu_backend;
  }

  location / {
    try_files $uri /index.html;
  }
}
