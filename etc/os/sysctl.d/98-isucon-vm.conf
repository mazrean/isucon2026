# ISUCON2026 VM tuning (installed by scripts/os-knobs.sh when VM=1; asia1 + asia2 by default).
# Measured 14:46 (4.7h uptime): asia2 compact_stall 20.4k / compact_fail 12.9k, allocstall 28k,
# pgscan_direct 1.6M, workingset_refault_file 30.5M, free 268MB, kswapd0 + kcompactd0 in top;
# asia1 compact_stall 3.2k, io PSI full avg60 5.25%.
# no reclaim boost after a fragmentation event (it evicts extra page cache = PG refaults)
vm.watermark_boost_factor = 0
# kswapd wakes earlier / reclaims further -> fewer direct-reclaim stalls inside PG backends / Go
vm.watermark_scale_factor = 125
vm.min_free_kbytes = 131072
# no proactive background compaction (kcompactd CPU on the 2-vCPU PG host)
vm.compaction_proactiveness = 0
# writeback starts at 64MB instead of 10% (~375MB) -> smaller bursts under fsync group commit
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 536870912
