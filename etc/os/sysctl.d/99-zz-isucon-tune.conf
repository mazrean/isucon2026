# ISUCON2026 infra tuning (installed by scripts/host-tune.sh). Named 99-zz-* so it sorts after 99-sysctl.conf.
# ip_local_port_range is left to the official 90-isucon.conf (10000-65535).
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 10
# keep cwnd on idle keepalive connections (europe1/america1 -> asia1:8080, standby <- asia2 at 100ms RTT)
net.ipv4.tcp_slow_start_after_idle = 0
# initial receive window = tcp_rmem[1]/2: 131072 -> 64KB caused an extra RTT for 64-100KB bodies at 100ms
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.ipv4.tcp_rmem = 4096 262144 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
fs.file-max = 2097152
