# asia2 (primary) CPU/WAL 削減の案 (未適用)。採用するなら
#   /etc/postgresql/16/main/conf.d/isucon-cpu.conf に置いて reload (restart 印のものは再起動まで反映されない)。
# 既に入っているもの (primary-tuning.conf): shared_buffers=1GB, max_connections=400, work_mem=16MB,
#   wal_compression=lz4, checkpoint_timeout=15min, max_wal_size=4GB。work_mem はこれ以上不要
#   (Memories/export の sort は 50KB 未満、ハッシュも小さい)。
#
# 本命は設定ではなく webapp/sql/011-indexes.sql の image_objects.data STORAGE EXTERNAL (pglz 回避)。

# JIT: 現状 jit=on。アプリのクエリは cost 200 前後で jit_above_cost(100000) に届かず効果なし。
# 統計の外れで大きな見積もりが出たときだけコンパイル (数十 ms) が走る事故を防ぐ。reload。
jit = off

# 非同期コミット: commit の WAL fsync を待たない (サンプルで LWLock:WALWrite / IO:WALSync が commit 待ちに出ている)。
# CPU よりも行ロック保持時間 (投稿 tx の users 行ロック) と接続占有を短くする効果。reload。
# リスク: OS/PG クラッシュ時に直近 ~wal_writer_delay*3 (≈600ms) のコミットを失う。正常停止・reboot では失わない。
# 可視性は遅れない (コミット直後に他セッションから見える) ので mem pump の pg_current_snapshot() バリアには影響しない。
# 同期レプリケーション (pg-sync on) と併用すると remote_apply の意味が消えるので、pg-sync off のときだけ。
synchronous_commit = off

# WAL バッファ: 現状 16MB (自動 = shared_buffers/32 だが WAL セグメント 16MB で頭打ち)。画像 (~700KB) の INSERT が並ぶと
# WALWrite 待ちが出るので 64MB に。(restart) 優先度低: これのためだけに再起動しないこと。
wal_buffers = 64MB

# TOAST 既定圧縮を lz4 に (image_objects 以外で 2KB を超える行は殆ど無いので保険)。reload。
default_toast_compression = lz4
