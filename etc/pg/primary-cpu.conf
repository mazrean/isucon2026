# asia2 (primary): /etc/postgresql/16/main/conf.d/zz-cpu.conf  (scripts/deploy.sh PGCPU=1 で配置 + reload)
# isucon-tuning.conf (max_wal_size=4GB) より後に読ませるため zz-。reload で効くものだけ。再起動が要るもの (wal_buffers, shared_buffers, huge_pages, wal_level) は入れない:
# ここに書くと最終の再起動試験で未検証のまま有効になるため。
#
# 実測 (14:00 job, pg_stat_bgwriter): checkpoints_req 64 / timed 7 → max_wal_size(4GB) 到達で
# 2〜4 分ごとに checkpoint (発火点 ≈ 4GB/(1+0.9) ≈ 2.1GB)。WAL 79GB 中 FPI 834k 件 ≈ 6.5GB (~8%)。
# 12GB にすると発火点 ≈ 6.3GB → 間隔 ~3 倍。checkpoint の書き出しバーストと、直後の FPI が ~1/3 に。
# リスク: pg_wal が最大 ~12GB (空き 27GB)、クラッシュ時の回復が長い (正常 reboot は影響なし)。
max_wal_size = 12GB
checkpoint_timeout = 20min

# JIT: アプリのクエリは cost 200 前後。統計の外れでコンパイル (数十 ms) が走る事故を消す。リスクなし。
jit = off

# 2KB 超の行 (画像以外) の TOAST 圧縮を lz4 に。image_objects.data は STORAGE EXTERNAL (圧縮しない) 済み。
default_toast_compression = lz4

# autovacuum: 画像 TOAST や notifications の vacuum がベンチ中に 1 vCPU を食わないよう間引く。
# リスク: 長時間走行で bloat がやや増える (initialize の DELETE 後の掃除が遅れる)。
autovacuum_vacuum_cost_delay = 10ms
