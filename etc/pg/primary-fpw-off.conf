# asia2 (primary): /etc/postgresql/16/main/conf.d/zz-fpw.conf  (scripts/deploy.sh PGFPW=1 で配置 + reload。既定 0)
# 効果: checkpoint 後の最初の変更ごとの全ページ書き出し (FPI) を止める。実測で WAL バイトの ~8% (6.5GB/79GB)、
#       max_wal_size=12GB 後はさらに小さい。画像 bytea の WAL (主成分) は減らない。期待効果は小。
# リスク (高): OS クラッシュ・電源断・EBS の部分書き込みで 8KB ページが半分だけ書かれると、WAL から直せず
#       データ破損 (起動不能やインデックス破損) になりうる。正常 shutdown/reboot では起きない。
#       壊れた場合の復旧手段は無い (バックアップ無し) → 最終走行には使わない。
full_page_writes = off
