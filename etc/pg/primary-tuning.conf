# asia2 (primary) : /etc/postgresql/16/main/conf.d/isucon-tuning.conf
# (restart) が付いたものは再起動まで反映されない。それ以外は reload で反映。
shared_buffers = 1GB                 # (restart)
max_connections = 400                # (restart)
effective_cache_size = 2500MB
work_mem = 16MB
random_page_cost = 1.1
effective_io_concurrency = 200
wal_compression = lz4                # 画像 WAL のリージョン間帯域対策
checkpoint_timeout = 15min
max_wal_size = 4GB
