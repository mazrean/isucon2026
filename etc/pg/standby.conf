# app host (standby) : /etc/postgresql/16/main/conf.d/isucon-standby.conf
# @HOST@ は asia1 / europe1 / america1 に置換される
shared_buffers = 256MB
# primary の max_connections (200) 以上でないと recovery が停止する
max_connections = 200
effective_cache_size = 1GB
hot_standby = on
hot_standby_feedback = on
# remote_apply 時、適用の遅れが primary の commit 待ちに直結するので短く
max_standby_streaming_delay = 500ms
max_standby_archive_delay = 500ms
wal_receiver_status_interval = 1s
wal_receiver_timeout = 10s
wal_retrieve_retry_interval = 1s
primary_conninfo = 'host=192.168.4.10 port=5432 user=replicator password=isurepl2026 application_name=@HOST@ connect_timeout=5 keepalives_idle=5 keepalives_interval=2 keepalives_count=3'
primary_slot_name = '@HOST@'
# 初回キャッチアップ用 (asia2 の walsave を一時 HTTP 配信)。サーバー停止後は即失敗 → streaming に移るだけで無害
restore_command = 'curl -sf --connect-timeout 1 -m 120 http://192.168.4.10:18081/%f -o %p'
